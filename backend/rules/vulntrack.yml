rules:
  - id: vulntrack.python.eval
    languages: [python]
    severity: ERROR
    message: Avoid eval() on input that may be influenced by an attacker.
    metadata:
      category: security
      shortDescription: Dynamic evaluation
      cwe: "CWE-95"
    pattern: eval(...)

  - id: vulntrack.python.exec
    languages: [python]
    severity: ERROR
    message: Avoid exec() on input that may be influenced by an attacker.
    metadata:
      category: security
      shortDescription: Dynamic execution
      cwe: "CWE-95"
    pattern: exec(...)

  - id: vulntrack.python.subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: Avoid shell=True with subprocess; pass an argument list instead.
    metadata:
      category: security
      shortDescription: Subprocess with shell enabled
      cwe: "CWE-78"
    pattern: subprocess.run(..., shell=True, ...)

  - id: vulntrack.python.pickle-loads
    languages: [python]
    severity: ERROR
    message: Do not deserialize untrusted data with pickle.loads().
    metadata:
      category: security
      shortDescription: Unsafe pickle deserialization
      cwe: "CWE-502"
    pattern: pickle.loads(...)

  - id: vulntrack.python.yaml-load
    languages: [python]
    severity: WARNING
    message: yaml.load() without a safe loader can construct unsafe Python objects.
    metadata:
      category: security
      shortDescription: YAML load without safe loader
      cwe: "CWE-502"
    patterns:
      - pattern: yaml.load($DATA)
      - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load($DATA, Loader=yaml.CSafeLoader)

  - id: vulntrack.python.sql-fstring
    languages: [python]
    severity: WARNING
    message: Avoid building SQL with an f-string; use a parameterized query.
    metadata:
      category: security
      shortDescription: SQL built with f-string
      cwe: "CWE-89"
      owasp: "A03:2021 Injection"
    pattern: $CURSOR.execute(f"...")

  - id: vulntrack.python.command-os-system
    languages: [python]
    severity: ERROR
    message: Avoid passing dynamically constructed commands to os.system().
    metadata:
      category: command-injection
      shortDescription: Shell command execution
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
    pattern: os.system(...)

  - id: vulntrack.python.path-traversal-request
    languages: [python]
    mode: taint
    severity: ERROR
    message: Do not use request-controlled paths directly to open files; constrain them to an allowed root.
    metadata:
      category: path-traversal
      shortDescription: Request-controlled file path
      cwe: "CWE-22"
      owasp: "A01:2021 Broken Access Control"
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.args[...]
      - pattern: request.form.get(...)
      - pattern: request.form[...]
      - pattern: request.json.get(...)
      - pattern: request.get_json(...)
    pattern-sinks:
      - pattern: open($PATH, ...)
      - pattern: pathlib.Path($PATH).open(...)
      - pattern: pathlib.Path($PATH).read_text(...)
      - pattern: pathlib.Path($PATH).write_text(...)
      - pattern: Path($PATH).open(...)
      - pattern: Path($PATH).read_text(...)
      - pattern: Path($PATH).write_text(...)
      - pattern: send_file($PATH, ...)

  - id: vulntrack.python.sql-taint
    languages: [python]
    mode: taint
    severity: ERROR
    message: User-controlled input reaches a SQL query string; use bound parameters.
    metadata:
      category: sql-injection
      shortDescription: Tainted SQL query
      cwe: "CWE-89"
      owasp: "A03:2021 Injection"
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.args[...]
      - pattern: request.form.get(...)
      - pattern: request.form[...]
      - pattern: request.json.get(...)
      - pattern: request.get_json(...)
    pattern-sinks:
      - pattern: $CURSOR.execute($QUERY)

  - id: vulntrack.javascript.tainted-dom-xss
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: Request-controlled data reaches an HTML rendering sink; escape it or render as text.
    metadata:
      category: cross-site-scripting
      shortDescription: Tainted HTML output
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
    pattern-sources:
      - pattern: $REQUEST.query[...]
      - pattern: $REQUEST.query.$FIELD
      - pattern: $REQUEST.params[...]
      - pattern: $REQUEST.params.$FIELD
      - pattern: $REQUEST.body[...]
      - pattern: $REQUEST.body.$FIELD
    pattern-sinks:
      - pattern: $ELEMENT.innerHTML = $VALUE
      - pattern: $ELEMENT.outerHTML = $VALUE
      - pattern: $ELEMENT.insertAdjacentHTML(..., $VALUE)
      - pattern: document.write($VALUE)

  - id: vulntrack.javascript.tainted-command
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: Request-controlled data reaches child_process.exec; avoid shell execution or validate arguments.
    metadata:
      category: command-injection
      shortDescription: Tainted shell command
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
    pattern-sources:
      - pattern: $REQUEST.query[...]
      - pattern: $REQUEST.query.$FIELD
      - pattern: $REQUEST.params[...]
      - pattern: $REQUEST.params.$FIELD
      - pattern: $REQUEST.body[...]
      - pattern: $REQUEST.body.$FIELD
    pattern-sinks:
      - pattern: child_process.exec($COMMAND, ...)
      - pattern: require('child_process').exec($COMMAND, ...)
      - pattern: child_process.execSync($COMMAND, ...)
      - pattern: require('child_process').execSync($COMMAND, ...)

  - id: vulntrack.python.unsafe-markup
    languages: [python]
    severity: WARNING
    message: Marking untrusted input as safe HTML can enable cross-site scripting.
    metadata:
      category: cross-site-scripting
      shortDescription: Unescaped HTML output
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
    pattern-either:
      - pattern: Markup($VALUE)
      - pattern: flask.Markup($VALUE)
      - pattern: render_template_string(f"...")

  - id: vulntrack.python.weak-hash
    languages: [python]
    severity: WARNING
    message: MD5 and SHA-1 are unsuitable for security-sensitive hashing; use a modern digest or password hashing.
    metadata:
      category: weak-cryptography
      shortDescription: Weak cryptographic hash
      cwe: "CWE-328"
      owasp: "A02:2021 Cryptographic Failures"
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: vulntrack.javascript.dom-xss
    languages: [javascript, typescript]
    severity: ERROR
    message: Assigning untrusted content to innerHTML can enable DOM-based XSS; use textContent or safe rendering.
    metadata:
      category: cross-site-scripting
      shortDescription: Unsafe innerHTML assignment
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
    pattern-either:
      - pattern: $ELEMENT.innerHTML = $VALUE
      - pattern: $ELEMENT.outerHTML = $VALUE
      - pattern: $ELEMENT.insertAdjacentHTML(..., $VALUE)
      - pattern: document.write($VALUE)

  - id: vulntrack.javascript.command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: Passing dynamic input to child_process.exec invokes a shell and may enable command injection.
    metadata:
      category: command-injection
      shortDescription: Shell command execution
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
    pattern-either:
      - pattern: child_process.exec($COMMAND, ...)
      - pattern: require('child_process').exec($COMMAND, ...)
      - pattern: child_process.execSync($COMMAND, ...)
      - pattern: require('child_process').execSync($COMMAND, ...)

  - id: vulntrack.javascript.weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5 and SHA-1 are unsuitable for security-sensitive hashing.
    metadata:
      category: weak-cryptography
      shortDescription: Weak cryptographic hash
      cwe: "CWE-328"
      owasp: "A02:2021 Cryptographic Failures"
    pattern-regex: (?i)createHash\s*\(\s*['"](?:md5|sha1)['"]

  - id: vulntrack.generic.hardcoded-secret
    languages: [generic]
    severity: ERROR
    message: A high-entropy credential appears to be hardcoded; load secrets from the environment or a secret manager.
    metadata:
      category: hardcoded-secret
      shortDescription: Possible hardcoded credential
      cwe: "CWE-798"
      owasp: "A07:2021 Identification and Authentication Failures"
    pattern-regex: (?i)\b(?:api[_-]?key|client[_-]?secret|password|passwd|secret|access[_-]?token)\b\s*[:=]\s*['"][A-Za-z0-9_./+=-]{24,}['"]
